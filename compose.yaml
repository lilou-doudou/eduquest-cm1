# Services locaux de développement. PostgreSQL et Mailpit n'écoutent que sur 127.0.0.1.
name: eduquest

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduquest}
      POSTGRES_USER: ${POSTGRES_USER:-eduquest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Base isolée pour les tests E2E (données jetables, n'affecte jamais la base de développement).
  postgres-e2e:
    image: postgres:16-alpine
    profiles: ["e2e"]
    environment:
      POSTGRES_DB: eduquest_e2e
      POSTGRES_USER: eduquest
      POSTGRES_PASSWORD: e2e-only
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduquest -d eduquest_e2e"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
