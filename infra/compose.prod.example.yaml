# Exemple de déploiement (non utilisé en local). Un reverse proxy TLS (Caddy, Traefik…) doit
# précéder le service « web ». Les secrets viennent d'un fichier d'environnement hors dépôt.
name: eduquest-prod
services:
  postgres:
    image: postgres:16-alpine
    env_file: ./prod.env
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20
  backend:
    image: eduquest-backend:${EDUQUEST_VERSION:-latest}
    env_file: ./prod.env
    depends_on: { postgres: { condition: service_healthy } }
  web:
    image: eduquest-frontend:${EDUQUEST_VERSION:-latest}
    depends_on: { backend: { condition: service_healthy } }
    ports: ["127.0.0.1:8081:8081"]
volumes:
  pgdata:
