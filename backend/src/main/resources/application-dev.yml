# Profil de développement local (HTTP) : cookie non Secure, Swagger local, comptes fictifs.
spring:
  datasource:
    password: ${POSTGRES_PASSWORD:eduquest-dev-only}
server:
  servlet:
    session:
      cookie:
        secure: false
springdoc:
  default-produces-media-type: application/json
