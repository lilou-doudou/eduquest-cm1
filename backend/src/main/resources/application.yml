# Configuration commune. Les secrets viennent de l'environnement (voir .env.example et README).
spring:
  application:
    name: eduquest
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/eduquest}
    username: ${POSTGRES_USER:eduquest}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 */10 * * * *"
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
  servlet:
    multipart:
      enabled: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: 8080
  max-http-request-header-size: 16KB
  tomcat:
    max-swallow-size: 64KB
    max-http-form-post-size: 64KB
  servlet:
    session:
      timeout: 30m
      cookie:
        name: EQSESSION
        http-only: true
        same-site: lax
        secure: true
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

eduquest:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:EduQuest CM1 <no-reply@eduquest.local>}
  auth:
    require-verified-email: true
  session:
    parent-idle: PT30M
    child-idle: PT60M
    absolute: PT12H
  security:
    hsts: false
  content:
    import: false
    path: ../content

logging:
  level:
    root: INFO
