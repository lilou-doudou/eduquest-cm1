name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Validation des contenus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: make content-validate

  backend:
    name: Backend (Java 21, unitaires + intégration PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Tests (Testcontainers utilise le Docker du runner)
        run: ./mvnw -B verify
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: surefire-reports, path: backend/target/surefire-reports }

  frontend:
    name: Frontend (typecheck, lint, tests, build, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm run lint && npm test && npm run build
        working-directory: frontend
      - name: Vulnérabilités des dépendances de production
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  e2e:
    name: E2E Playwright (pile isolée)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: '**/package-lock.json' }
      - run: cp .env.example .env
      - run: npm ci
        working-directory: frontend
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      - run: make test-e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/.logs

  fresh-clone:
    name: Démarrage depuis un clone neuf (README)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Suivre le mode manuel du README sur une base vierge
        run: |
          cp .env.example .env
          docker compose up -d --wait postgres mailpit
          make content-import
          make content-import   # réimport : aucun doublon attendu
          make backend-dev > backend.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:8080/actuator/health && break; sleep 2; done
          curl -sf http://localhost:8080/actuator/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/worlds)" = 401
          set -a; . ./.env; set +a
          docker compose exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
            "select count(*) from mission_version where status = 'PUBLISHED'" | grep -qx 24
          docker compose exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
            "select count(*) from exercise e join mission_version v on v.id = e.mission_version_id where v.status = 'PUBLISHED'" | grep -qx 120
      - if: failure()
        run: cat backend.log || true

  images:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/backend.Dockerfile -t eduquest-backend .
      - run: docker build -f infra/frontend.Dockerfile -t eduquest-frontend .

  secrets:
    name: Recherche de secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # CLI plutôt que l'action : l'action calcule « premier commit^ » et échoue sur un dépôt neuf.
      - name: Gitleaks sur tout l'historique
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact -v --exit-code 1 .

  dependency-review:
    name: Revue des dépendances (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with: { fail-on-severity: high }
